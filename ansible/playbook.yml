
---
- name: Configure EC2 server for DevOps deployment
  hosts: webservers
  connection: local
  become: true

  tasks:
    - name: Ensure Docker is installed
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Ensure Docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Verify Docker Compose installation
      ansible.builtin.command:
        cmd: docker compose version
      register: compose_version
      changed_when: false

    - name: Display Docker Compose version
      ansible.builtin.debug:
        msg: "{{ compose_version.stdout }}"

    - name: Ensure ec2-user belongs to Docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true

    - name: Ensure Jenkins belongs to Docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Create application deployment directory
      ansible.builtin.file:
        path: /opt/devops-capstone
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'
